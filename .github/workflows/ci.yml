name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Next 16 requires >= 20.9; 22 is the active LTS.
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # Next generates the global route helpers (LayoutProps, PageProps) into
      # .next/, which is gitignored -- so a fresh clone has none of them and
      # `tsc` fails with "Cannot find name 'LayoutProps'". This passed locally
      # only because a previous build had left .next/ on disk: the typecheck was
      # silently depending on a stale artifact. `next typegen` is the documented
      # way to produce those definitions for CI type-checking without a build.
      - name: Generate route types
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fails on high/critical advisories. This repo shipped a pinned Next
      # version with an unauthenticated RCE, so the gate is deliberate: a
      # failing audit should be visible rather than discovered by a user.
      # For a genuine upstream blocker with no fix available, add the advisory
      # to an `audit` allow-list here rather than removing the step.
      - name: Audit (high and above)
        run: npm audit --audit-level=high
